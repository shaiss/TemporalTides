<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Nexus — chamber + choice rail</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app" data-mode="vibrion" data-beat="">
    <canvas id="chamber-canvas" aria-hidden="true"></canvas>
    <div class="entropy-vignette" aria-hidden="true"></div>
    <div class="lens-filter" id="lens-filter" aria-hidden="true"></div>

    <div class="chrome-top">
      <div class="chrome-top-inner">
        <span class="beat-pill" id="hud-beat">Beat —</span>
        <p class="narrative-line" id="narrative-line" aria-live="polite">One lens at a time.</p>
      </div>
      <div class="mode-chips" id="mode-chips" aria-label="Active ability modes (display only)"></div>
    </div>

    <p id="story" class="sr-only" aria-live="polite"></p>

    <div class="chrome-bottom">
      <div id="choices" class="choice-rail"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
