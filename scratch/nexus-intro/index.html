<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Nexus — chamber + choice rail</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="chamber-canvas" aria-hidden="true"></canvas>
    <div class="entropy-vignette" aria-hidden="true"></div>

    <div class="overlay-ui">
      <header class="top-bar">
        <h1>Time Nexus — intro spike</h1>
        <p class="meta">Ink rules · Three.js eyes · locked wide camera</p>
      </header>

      <div class="hud" aria-live="polite">
        <div class="hud-beat" id="hud-beat">Beat —</div>
        <div class="hud-cue" id="hud-cue">One lens at a time.</div>
      </div>

      <div class="mode-chips" id="mode-chips" aria-label="Active ability modes (display only)"></div>

      <div class="story-panel">
        <div id="story"></div>
        <div id="choices" class="choice-rail"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
