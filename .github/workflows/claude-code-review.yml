# Automated PR code review via the code-review plugin (anthropics/claude-code).
#
# SETUP (repo admin):
#   - Secret: CLAUDE_CODE_OAUTH_TOKEN — long-lived token from `claude setup-token`
#     (Claude Pro/Max/Team/Enterprise). Pass it only as `claude_code_oauth_token`
#     below; do not substitute ANTHROPIC_API_KEY in this workflow unless you
#     intentionally switch auth modes.
#   - Install the Claude GitHub App on this repo (OIDC + PR comment tools).
#
# If the job fails immediately with `is_error: true`, 1 turn, ~$0, and no
# model usage, the secret is usually present but expired or invalid — mint a
# new token locally and update the repository secret (no workflow change needed).
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

